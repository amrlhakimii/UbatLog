  <!-- wordmark -->
  <g font-family="'Sora','Plus Jakarta Sans',sans-serif" font-weight="800">
    <text x="700" y="240" font-size="150">
      <tspan fill="url(#ubat)">Ubat</tspan><tspan fill="#ff4081">Log</tspan>
    </text>
    <text x="700" y="300" font-size="42" fill="#8a8a94" font-family="'Plus Jakarta Sans',sans-serif" font-weight="500">Effortless Clinic Medication Log</text>
  </g>
