<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" width="1500" height="480">
  <defs>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fa6"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <linearGradient id="notebook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4081"/>
      <stop offset="1" stop-color="#a61c49"/>
    </linearGradient>
    <linearGradient id="ubat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a61c49"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="480" fill="#fdf6f8"/>

  <!-- icon group -->
  <g transform="translate(60,50)">
    <g fill="none" stroke="url(#notebook)" stroke-width="14">
      <circle cx="36" cy="26" r="23"/>
      <circle cx="36" cy="98" r="23"/>
      <circle cx="36" cy="170" r="23"/>
      <circle cx="36" cy="242" r="23"/>
      <circle cx="36" cy="314" r="23"/>
    </g>

    <rect x="9" y="0" width="600" height="340" rx="30" fill="none" stroke="url(#notebook)" stroke-width="14"/>

    <rect x="49" y="27" width="242" height="286" rx="18" fill="#ffffff" stroke="#ffe3ea" stroke-width="4"/>
    <g>
      <rect x="134" y="80" width="72" height="170" rx="14" fill="url(#cross)"/>
      <rect x="94" y="121" width="152" height="72" rx="14" fill="url(#cross)"/>
    </g>
    <rect x="80" y="268" width="116" height="12" rx="6" fill="#ffb6c1"/>
    <g transform="translate(228,260) rotate(35)">
      <rect x="0" y="0" width="54" height="23" rx="11" fill="#ffffff" stroke="#ff4081" stroke-width="5"/>
      <line x1="27" y1="0" x2="27" y2="23" stroke="#ff4081" stroke-width="4"/>
    </g>

    <rect x="309" y="27" width="269" height="286" rx="18" fill="#fff5f8" stroke="#ffe3ea" stroke-width="4"/>
    <path d="M331 63 h170 M486 50 l22 13 l-22 13" fill="none" stroke="#ff4081" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M335 125 l13 14 l23 -27" fill="none" stroke="#d6336c" stroke-width="11"/>
      <rect x="384" y="125" width="134" height="11" rx="5.5" fill="#ffb6c1"/>

      <path d="M335 188 l13 14 l23 -27" fill="none" stroke="#d6336c" stroke-width="11"/>
      <rect x="384" y="188" width="134" height="11" rx="5.5" fill="#ffb6c1"/>

      <path d="M335 251 l13 14 l23 -27" fill="none" stroke="#d6336c" stroke-width="11"/>
      <rect x="384" y="251" width="134" height="11" rx="5.5" fill="#ffb6c1"/>
    </g>
